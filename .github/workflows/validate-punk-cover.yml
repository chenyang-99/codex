name: Validate Punk cover installation

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/punk-cover'
      - 'vendor/punk-skill'
      - '.gitmodules'
      - 'AGENTS.md'
      - 'scripts/install-punk-cover.sh'
      - '.github/workflows/validate-punk-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the cloud repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check installer syntax
        run: bash -n scripts/install-punk-cover.sh
      - name: Install and verify the official skill and shared styles
        run: bash scripts/install-punk-cover.sh
      - name: Verify repeated installation preserves the original files
        run: bash scripts/install-punk-cover.sh

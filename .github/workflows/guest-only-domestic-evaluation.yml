name: Guest-only domestic collector evaluation

# Retired repeated blocked anonymous XHS search, Douyin nested-reply and
# browser challenges. Preserved run evidence in docs; do not replay blocks.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/guest-only-domestic-evaluation.yml'
      - 'douyin_creator_discovery.py'
      - 'social-topic-radar/douyin_acceptance.py'
      - 'social-topic-radar/douyin_native_search_audit.py'

permissions:
  contents: read

jobs:
  permitted-public-douyin:
    name: Validate bounded permitted public demo reads, not full platform access
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check existing published free demo OpenAPI for native search
        run: python social-topic-radar/douyin_native_search_audit.py
      - name: Sample public creator posts and inline comments within budget
        run: python douyin_creator_discovery.py
      - name: Write truthful end-to-end capability verdict
        run: python social-topic-radar/douyin_acceptance.py
      - name: Upload evidence and acceptance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-public-capability-verdict
          path: |
            social-topic-radar/output/douyin-native-search-capability.json
            social-topic-radar/output/douyin-creator-discovery.json
            social-topic-radar/output/douyin-acceptance.json
            social-topic-radar/output/douyin-acceptance.md
          if-no-files-found: warn
          retention-days: 14

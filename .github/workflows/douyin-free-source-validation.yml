name: Douyin free-source gap verification

on:
  workflow_dispatch:
  push:
    paths:
      - "social-topic-radar/douyin_comment_pages.py"
      - "social-topic-radar/douyin_public_search_indexes.py"
      - ".github/workflows/douyin-free-source-validation.yml"

permissions:
  contents: read

jobs:
  comment-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check actual inline replies across at most two ordinary comment pages
        run: python social-topic-radar/douyin_comment_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-normal-comment-page-evidence
          path: social-topic-radar/output/douyin-bounded-comment-pages.json
          if-no-files-found: warn
          retention-days: 7

  public-search-index:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check three public search indexes for actual Douyin video links
        run: python social-topic-radar/douyin_public_search_indexes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-public-index-evidence
          path: social-topic-radar/output/douyin-public-index-validation.json
          if-no-files-found: warn
          retention-days: 7

name: Anonymous social content probe

on:
  push:
    paths:
      - "social-topic-radar/**"
      - "douyin_creator_discovery.py"
      - ".github/workflows/anonymous-social-probe.yml"
  workflow_dispatch:
  schedule:
    # Every 3 hours; scheduled GitHub Actions runs may be delayed.
    - cron: "15 */3 * * *"

permissions:
  contents: read

concurrency:
  group: anonymous-social-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Read-only no-login platform verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify local probe source syntax
        run: python -m py_compile social-topic-radar/probe.py
      - name: Fetch pinned upstream X skill (no social credentials)
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, urllib.request
          # Immutable Git commit, not a mutable main branch.
          url = ("https://raw.githubusercontent.com/qianyubtc/X-Aggregate-Data/"
                 "83f7b430ea4645e5226572649006c41b0ce14dae/"
                 "skills/x-aggregate-data/scripts/x.py")
          dest = pathlib.Path("social-topic-radar/x_upstream.py")
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers={"User-Agent": "social-topic-radar/1.0"}),
                  timeout=25
              ) as response:
                  contents = response.read(120000)
              if not contents.startswith(b"#!/usr/bin/env python3"):
                  raise ValueError("Unexpected upstream file header")
              dest.write_bytes(contents)
              print("Pinned upstream X reader installed:", len(contents), "bytes")
          except Exception as error:
              # Probe continues to report X as unavailable, not "successful".
              print("Upstream unavailable:", type(error).__name__, str(error)[:150])
          PY
      - name: Execute actual anonymous public-data probes
        run: python social-topic-radar/probe.py
      - name: Discover public X creator posts and sample replies
        run: python social-topic-radar/discovery.py
      - name: Retrieve public official RSS discovery sources
        run: python social-topic-radar/rss_discovery.py
      - name: Audit AICG 20 X creators and 18 sites (read-only)
        run: python social-topic-radar/aicg_source_audit.py
      - name: Collect AICG creator original posts with media and links
        run: python social-topic-radar/aicg_x_content.py
      - name: Collect first-party AICG project pages and Hub API items
        run: python social-topic-radar/aicg_site_content.py
      - name: Normalize AICG works into evidence-linked recent candidates
        run: python social-topic-radar/aicg_candidate_merge.py
      - name: Verify other public platform content and comments
        run: python social-topic-radar/public_platforms.py
      - name: Test pinned public Douyin hot-search CLI
        run: python social-topic-radar/douyin_public.py
      - name: Discover indexed Xiaohongshu Douyin links and test Bilibili V2EX comments
        run: python social-topic-radar/domestic_discovery.py
      - name: Test alternate public index routes to XHS and Douyin
        run: python social-topic-radar/domestic_multisearch.py
      - name: Verify public-index XHS and Douyin permalinks
        run: python social-topic-radar/domestic_permalink_verification.py
      - name: Audit whether free Douyin demo now exposes a native keyword-search endpoint
        run: python social-topic-radar/douyin_native_search_audit.py
      - name: Discover actual AI creator videos and sample comments via public free Douyin demo
        run: python douyin_creator_discovery.py
      - name: Aggregate evidence-linked domestic comment pain points
        run: python social-topic-radar/domestic_painpoints.py
      - name: Build evidence-labeled multi-source editorial shortlist
        run: python social-topic-radar/editorial.py
      - name: Audit V2 fifteen-domain and five-type discovery coverage
        run: python social-topic-radar/topic_catalog.py coverage --output-dir social-topic-radar/output
      - name: Consolidate source-specific domestic search and comment access status
        run: python social-topic-radar/domestic_status.py
      - name: Verify topic evidence gate regression tests
        run: python -m unittest discover -s social-topic-radar/tests -v
      - name: Audit real collected topic signals without auto-approving publication
        if: always()
        run: python social-topic-radar/topic_quality_gate.py radar --output-dir social-topic-radar/output
      - name: Generate strict full-access acceptance verdict for Douyin
        if: always()
        run: python social-topic-radar/douyin_acceptance.py
      - name: Publish truthful capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-probe-report
          path: social-topic-radar/output/
          if-no-files-found: warn
          retention-days: 14

name: AI Copy Skill Quality Checks

on:
  push:
    branches:
      - main
      - 'feat/ai-copy-production-*'
    paths:
      - '.agents/skills/ai-copy-production/**'
      - '.github/workflows/ai-copy-quality.yml'
  pull_request:
    paths:
      - '.agents/skills/ai-copy-production/**'
      - '.github/workflows/ai-copy-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout approved repository
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify both copy and editorial preflight syntax
        run: |
          python -m py_compile .agents/skills/ai-copy-production/scripts/copy_quality_gate.py
          python -m py_compile .agents/skills/ai-copy-production/scripts/editorial_preflight.py
      - name: Run synthetic author-preservation and evidence tests
        run: python -m unittest discover -s .agents/skills/ai-copy-production/tests -p 'test_*.py' -v

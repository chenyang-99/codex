name: Zotero ChatGPT bridge helper smoke test

on:
  push:
    paths:
      - .github/workflows/zotero-chatgpt-smoke.yml
      - .agents/skills/zotero-research/scripts/zotero_cloud.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static and mocked API checks without credentials
        run: |
          python -m py_compile .agents/skills/zotero-research/scripts/zotero_cloud.py
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          from unittest.mock import patch
          
          p = Path('.agents/skills/zotero-research/scripts/zotero_cloud.py')
          spec = importlib.util.spec_from_file_location('zotero_cloud', p)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with patch.dict(os.environ, {'ZOTERO_USER_ID': '475425', 'ZOTERO_API_KEY': ''}):
              user, key = module.config()
              assert (user, key) == ('475425', '')
              client = module.Zotero(user, key)
              assert 'Zotero-API-Key' not in client.headers
              assert client.headers['Zotero-API-Version'] == '3'

          with patch.dict(os.environ, {'ZOTERO_USER_ID': '475425', 'ZOTERO_API_KEY': 'test-only-key'}):
              user, key = module.config()
              client = module.Zotero(user, key)
              assert client.headers['Zotero-API-Key'] == 'test-only-key'
          
          with patch.dict(os.environ, {'ZOTERO_USER_ID': 'bad', 'ZOTERO_API_KEY': ''}):
              try:
                  module.config()
              except module.ZoteroError:
                  pass
              else:
                  raise AssertionError('Invalid user IDs must be rejected')
          print('PASS: public/private read-only Zotero configuration; no real credentials or library data accessed')
          PY
